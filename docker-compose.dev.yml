version: "3.3"

services:
  # MinIO S3-compatible storage
  # Uses the official image by default. On CPUs that don't support
  # x86-64-v2, add docker-compose.minio-source.yml as an extra -f file
  # to build MinIO from source instead (see minio/Dockerfile).
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000" # API (internal)
      - "10777:9000" # API (public URL endpoint)
      - "9091:9090" # Console (mapped to 9091 to avoid conflicts)
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    volumes:
      - ./data/minio:/data
    networks:
      - session-recorder-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  session-recorder-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16

volumes:
  protocol-data:
    driver: local
